[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autograder"
version = "0.1.0"
description = "General-purpose autograder framework"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/autograder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
