[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autograder"
version = "0.1.0"
description = "General-purpose autograder framework"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/framework"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["src/framework/tests", "src/project-autograders/tests"]
pythonpath = ["src", "src/project-autograders"]
